name: Something's wrong
description: Playbook shows something wrong, or doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Playbook did instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Under Help → About.
      placeholder: "0.5.5"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Safari, Other]
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: Problems listed in Help → About
      description: If Help → About lists any problems, copy them here.
      render: text
